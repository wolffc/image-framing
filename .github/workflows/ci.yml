name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The lowest Payload 3 minor the package supports (peerDependencies), with a
# Next version that Payload release supports.
env:
  LOWEST_PAYLOAD: 3.39.0
  LOWEST_NEXT: 15.3.3

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # SQLite, no services.
      - run: pnpm test:int
      - run: pnpm build

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node }}
      - run: pnpm test

  integration:
    name: Integration (${{ matrix.db }}, ${{ matrix.payload }} Payload)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mongodb]
        payload: [latest, lowest]
        exclude:
          # SQLite on the latest Payload runs in the check job.
          - db: sqlite
            payload: latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: image_framing
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          payload: ${{ matrix.payload == 'lowest' && env.LOWEST_PAYLOAD || '' }}
          next: ${{ matrix.payload == 'lowest' && env.LOWEST_NEXT || '' }}
      - name: Typecheck the package
        if: matrix.payload == 'lowest'
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Unit tests
        if: matrix.payload == 'lowest'
        run: pnpm test
      - name: Integration tests
        run: pnpm test:int
        env:
          DATABASE_URI: >-
            ${{ matrix.db == 'postgres' && 'postgres://postgres:postgres@localhost:5432/image_framing'
            || matrix.db == 'mongodb' && 'mongodb://localhost:27017/image_framing' || '' }}

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the dev app
        run: |
          pnpm dev > dev-server.log 2>&1 &
          timeout 300 bash -c 'until curl -sf -o /dev/null http://localhost:3000/admin; do sleep 2; done'
      - run: pnpm test:e2e
      - name: Dev server log
        if: failure()
        run: tail -100 dev-server.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  examples:
    name: Build the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build:examples

  storage:
    name: Cloud storage (S3)
    runs-on: ubuntu-latest
    services:
      s3:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090
    env:
      S3_ENDPOINT: http://localhost:9090
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Wait for the S3 server
        run: timeout 90 bash -c 'until curl -s -o /dev/null $S3_ENDPOINT; do sleep 1; done'
      - run: pnpm exec vitest run --project int test/int/s3.int.spec.ts

  pack:
    name: Pack and install (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest Payload, Node 24
            node: 24
          - name: lowest Payload, Node 20
            node: 20
            lowest: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node }}
      - name: Pack, install and import every entry point
        run: |
          if [ "${{ matrix.lowest }}" = "true" ]; then
            export PAYLOAD_VERSION=$LOWEST_PAYLOAD NEXT_VERSION=$LOWEST_NEXT
          fi
          pnpm test:pack
