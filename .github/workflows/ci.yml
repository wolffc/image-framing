name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The lowest Payload 3 minor the package supports (peerDependencies), with a
# Next version that Payload release supports.
env:
  LOWEST_PAYLOAD: 3.39.0
  LOWEST_NEXT: 15.3.3

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  lowest-payload:
    name: Typecheck and test on the lowest supported Payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Payload ${{ env.LOWEST_PAYLOAD }}
        run: >-
          pnpm add -D payload@$LOWEST_PAYLOAD @payloadcms/ui@$LOWEST_PAYLOAD
          @payloadcms/next@$LOWEST_PAYLOAD @payloadcms/db-sqlite@$LOWEST_PAYLOAD
          @payloadcms/storage-s3@$LOWEST_PAYLOAD next@$LOWEST_NEXT
      # The package and its tests; the dev app's generated files follow the latest Payload.
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm test
      - run: pnpm build

  storage:
    name: Cloud storage (S3)
    runs-on: ubuntu-latest
    services:
      s3:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090
    env:
      S3_ENDPOINT: http://localhost:9090
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the S3 server
        run: timeout 90 bash -c 'until curl -s -o /dev/null $S3_ENDPOINT; do sleep 1; done'
      - run: pnpm exec vitest run test/int/s3.int.spec.ts

  pack:
    name: Pack and install (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest Payload, Node 24
            node: 24
          - name: lowest Payload, Node 20
            node: 20
            lowest: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack, install and import every entry point
        run: |
          if [ "${{ matrix.lowest }}" = "true" ]; then
            export PAYLOAD_VERSION=$LOWEST_PAYLOAD NEXT_VERSION=$LOWEST_NEXT
          fi
          pnpm test:pack
