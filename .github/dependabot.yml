version: 2
updates:
  # Development dependencies, grouped into one pull request a week. The
  # peer ranges (payload, react, …) are a compatibility decision: change
  # them by hand, see "Compatibility" in the README.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    allow:
      - dependency-type: development
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  # The dev image's Node base (security releases).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    # Patch and minor releases only: moving to a new Node major is a decision.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
