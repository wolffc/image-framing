version: 2
updates:
  # Development dependencies, grouped into one pull request a week. The
  # peer ranges (payload, react, …) are a compatibility decision: change
  # them by hand, see "Compatibility" in the README.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    allow:
      - dependency-type: development
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
