# Everything runs in containers. Use ./dev.sh rather than calling this directly.
name: image-framing

services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: image-framing-dev
    working_dir: /app
    init: true
    environment:
      DATABASE_URI: ${DATABASE_URI:-file:/app/dev/.data/dev.db}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      # Polling keeps hot reload working on Docker Desktop (macOS/Windows) bind mounts.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    ports:
      - '${PORT:-3000}:3000'
    networks:
      default:
        aliases: [framing-dev]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/dev/.next
      - pnpm_store:/pnpm/store

  # Playwright, for the e2e tests against the dev service: ./dev.sh test-e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    user: '1000:1000'
    working_dir: /app
    environment:
      # Not http://dev: .dev (like .app) is an HTTPS-only domain in Chromium.
      E2E_BASE_URL: http://framing-dev:3000
      HOME: /tmp
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ['node_modules/.bin/playwright', 'test']

  # Databases for the integration tests: ./dev.sh test-int postgres|mongodb
  postgres:
    image: postgres:17-alpine
    profiles: [db]
    environment:
      POSTGRES_DB: image_framing
      POSTGRES_PASSWORD: postgres
    tmpfs: /var/lib/postgresql/data

  mongodb:
    # Not 8: mongo 8 exits on Linux kernel 6.19+ (SERVER-121912).
    image: mongo:7
    profiles: [db]
    tmpfs: /data/db

  # An S3-compatible server for the storage tests: ./dev.sh test-s3
  s3:
    image: adobe/s3mock:5.2.3
    profiles: [s3]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'false'

volumes:
  node_modules:
  next_cache:
  pnpm_store:
